name: Paper reproducibility CI
on:
  push:
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Compile Java and run retry policy unit tests
        run: mvn -B -Dtest=RetryDelayPolicyTest test
      - name: Validate experiment scripts
        run: |
          bash -n scripts/run-k6-docker.sh
          bash -n scripts/run-conflict-calibration.sh
          bash -n scripts/run-conflict-strategy-matrix.sh
          python3 -m py_compile scripts/aggregate_paper.py
      - name: Validate k6 script
        run: docker compose -f deploy/load/compose.yml run --rm -T k6 inspect k6/benchmark.js >/dev/null
      - name: Validate compose files
        env:
          DB_HOST: 10.0.0.30
          DB_PASSWORD: ci-local-only
          MYSQL_ROOT_PASSWORD: ci-local-root-only
        run: |
          docker compose -f deploy/app/compose.yml config >/dev/null
          docker compose -f deploy/db/compose.yml config >/dev/null
          docker compose -f deploy/load/compose.yml config >/dev/null
