services:
  app:
    build:
      context: ../..
      dockerfile: deploy/app/Dockerfile
    image: optimistic-lock-retry-lab-app:experiment
    container_name: retry-lab-app
    restart: unless-stopped
    network_mode: host
    cpus: "2.0"
    mem_limit: 4g
    environment:
      DB_URL: jdbc:mysql://${DB_HOST:?Set DB_HOST in .env}:3306/retry_lab?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USERNAME: retry_lab
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_POOL_SIZE: 32
      DB_POOL_MIN_IDLE: 8
      TOMCAT_MAX_THREADS: 200
      MAX_RETRIES: 5
      FIXED_DELAY_MS: 20
      EXP_BASE_MS: 5
      EXP_CAP_MS: 80
      JITTER_RATIO: 0.5
      JAVA_TOOL_OPTIONS: -Xms2g -Xmx2g -XX:+ExitOnOutOfMemoryError
    stop_grace_period: 30s
